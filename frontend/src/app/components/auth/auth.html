<div class="d-flex justify-content-center align-items-center min-vh-100 bg-light ">

  <div class="d-flex justify-content-center align-items-center">
    <div class="form-card  row bg-white rounded-4 overflow-hidden shadow-lg g-0">

      <div class="col-md-6 d-flex align-items-center justify-content-center  bg-color text-white text-center">
        <img src="images/gharserent.jpg " alt="Start your journey" width="450px" height="auto" class="img-fluid rounded-3">
      </div>

      <div class="col-md-6 p-5">
        <div class="text-end text-secondary mb-4">
          <span *ngIf="isLoginView">Don't have an account?</span>
          <span *ngIf="!isLoginView">Already have an account?</span>
          <button type="button" class="btn btn-link text-primary fw-bold ms-1 shadow-none text-decoration-none"
            (click)="toggleView()">
            {{ isLoginView ? 'Sign up' : 'Sign In' }}
          </button>
        </div>

        <h2 class="h4 fw-bold text-dark mb-4">{{ isLoginView ? 'Sign In' : 'Sign Up' }}</h2>

        <form [formGroup]="authForm" (ngSubmit)="onSubmit()">

          <div class="input-group mb-3">
            <span class="input-group-text bg-light text-secondary rounded-pill-start border-end-0">
              <i class="fas fa-envelope"></i>
            </span>
            <input type="email" placeholder="E-Mail" formControlName="email"
              class="form-control rounded-pill-end ps-0 border-start-0">
              
          </div>

            <div class="input-group mb-3">
                <span class="input-group-text bg-light text-secondary rounded-pill-start border-end-0">
              <i class="fas fa-lock"></i>
            </span>
            <input type="password" placeholder="Password" formControlName="password"
              class="form-control rounded-pill-end ps-0 border-start-0">
            </div>
          

          <div class="input-group mb-3" *ngIf="!isLoginView">
            <span class="input-group-text bg-light text-secondary rounded-pill-start border-end-0">
              <i class="fas fa-user"></i>
            </span>
            <input type="text" placeholder="Name" formControlName="name" (input)="capitalizeFirstLetter('name')"
              class="form-control rounded-pill-end ps-0 border-start-0">
                  
          </div>

          <div class="d-grid gap-2 mt-2">
            <button type="submit" class="btn  bg-color text-white rounded-pill fw-bold">
              {{ isLoginView ? 'Sign In' : 'Sign Up' }}
            </button>
          </div>

        </form>

      </div>
    </div>
  </div>
</div>
