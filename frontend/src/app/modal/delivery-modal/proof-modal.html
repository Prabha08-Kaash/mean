<div class="modal-backdrop" *ngIf="isOpen">
  <div class="modal-container">
    <div class="modal-header d-flex justify-content-between align-items-center">
      <h5 class="m-0">
        {{ actionType === 'delivery' ? 'Confirm Delivery' : 'Confirm Return' }}
      </h5>
      <button class="btn-close" (click)="close()"></button>
    </div>

    <div class="modal-body">
      <form (ngSubmit)="submit()" #form="ngForm">
        <!-- Upload Photo -->
        <div class="mb-3">
          <label class="form-label">Upload Photo</label>
          <input
            type="file"
            class="form-control"
            (change)="onFileSelected($event)"
            accept="image/*"
            required
          />
        </div>

        <!-- OTP -->
        <div class="mb-3">
          <button type="button" class="btn btn-warning w-100" (click)="generateOtp()" [disabled]="loading">
            {{ loading ? 'Sending OTP...' : 'Generate OTP' }}
          </button>
        </div>

        <div class="mb-3" *ngIf="otpSent">
          <label class="form-label">Enter OTP</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="otp"
            name="otp"
            placeholder="Enter the OTP sent to email"
            required
          />
        </div>

        <!-- Image Preview -->
        <div *ngIf="previewUrl" class="text-center mb-3">
          <img [src]="previewUrl" class="img-fluid rounded" style="max-height: 200px;" />
        </div>

        <!-- Action Buttons -->
        <div class="d-flex justify-content-between">
          <button type="button" class="btn btn-secondary" (click)="close()">Cancel</button>
          <button type="submit" class="btn btn-success" [disabled]="!form.valid || loading">
            {{ loading ? 'Submitting...' : 'Submit' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
